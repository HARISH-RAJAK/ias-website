name: Deploy Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          script: |
            cd ~/domains/ias.clickncult.com/public_html
            [ -f .env ] && cp -f .env .env.keep 2>/dev/null || true
            [ -f backend/.env ] && cp -f backend/.env backend/.env.keep 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e .env.keep -e backend/.env -e backend/.env.keep
            [ -f .env.keep ] && mv -f .env.keep .env 2>/dev/null || true
            [ -f backend/.env.keep ] && mv -f backend/.env.keep backend/.env 2>/dev/null || true
            chmod +x deploy.sh
            ./deploy.sh